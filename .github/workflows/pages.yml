# Publishes the demo video player (site/index.html) on GitHub Pages, so judges can watch the video in the browser.
# The video, its captions, the poster and the deck are copied in from docs/deliverables at build time, so nothing is
# stored twice in git. Runs on a push to main that changes one of them, or by hand (workflow_dispatch).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/deliverables/VoltProof_demo.mp4"
      - "docs/deliverables/VoltProof_demo.vtt"
      - "docs/deliverables/video_poster.jpg"
      - "docs/deliverables/VoltProof_deck.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the player page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Copy the page, the video, its captions, the poster and the deck
        run: |
          mkdir -p _site
          cp site/index.html _site/
          for f in VoltProof_demo.mp4 VoltProof_demo.vtt video_poster.jpg VoltProof_deck.pdf; do
            cp "docs/deliverables/$f" "_site/$f"
          done
          ls -l _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
