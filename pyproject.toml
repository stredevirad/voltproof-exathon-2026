[project]
name = "voltproof"
version = "0.1.0"
description = "Traceable evidence of power cuts and poor supply from ESMI minute-wise voltage data, analysed in Exasol Personal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyexasol>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "playwright>=1.45",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "exasol: needs a running Exasol Personal deployment",
    "e2e: browser end-to-end tests (Playwright)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
